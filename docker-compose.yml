services:

  
  # ----------------------------
  # BD_Area1 -> Oracle AI Database 26ai Free
  # ----------------------------
  oracle-area1:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-area1
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: DbArea12024!
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle1_data:/opt/oracle/oradata

  # ----------------------------
  # BD_Area2 -> PostgreSQL 16
  # ----------------------------
  postgresql-area2:
    image: postgres:16
    container_name: postgresql-area2
    restart: unless-stopped
    ports:
      - "5429:5432"
    environment:
      POSTGRES_USER: area2_user
      POSTGRES_PASSWORD: PgArea2Secure!2024
      POSTGRES_DB: db_area2
    volumes:
      - postgres2_data:/var/lib/postgresql/data

volumes:
  oracle1_data:
  postgres2_data: