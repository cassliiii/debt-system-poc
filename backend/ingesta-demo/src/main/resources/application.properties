quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.log.level=WARN
quarkus.log.category."pe.demo".level=INFO

# ---- Area 1 -> Oracle ----
quarkus.datasource.area1.db-kind=oracle
quarkus.datasource.area1.username=AREA1
quarkus.datasource.area1.password=DbArea12024!
quarkus.datasource.area1.jdbc.url=${ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
quarkus.datasource.area1.jdbc.max-size=20

# ---- Area 2 -> PostgreSQL ----
quarkus.datasource.area2.db-kind=postgresql
quarkus.datasource.area2.username=area2_user
quarkus.datasource.area2.password=PgArea2Secure!2024
quarkus.datasource.area2.jdbc.url=${PG_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.area2.jdbc.max-size=16

# --- Servicio ---
quarkus.http.port=8080
quarkus.http.limits.max-body-size=500M
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS

# --- Ingesta ---
ingesta.dir=${INGESTA_DIR:ingestas}
ingesta.threads=12
ingesta.batch-size=1000
ingesta.queue-size=10000
ingesta.commit-mode=nowait
ingesta.max-concurrentes=2

quarkus.container-image.group=ingesta
quarkus.container-image.name=ingesta-demo
quarkus.container-image.tag=latest
quarkus.docker.dockerfile-jvm-path=src/main/docker/Dockerfile.jvm