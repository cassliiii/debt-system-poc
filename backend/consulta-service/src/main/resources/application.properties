quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.log.level=INFO
quarkus.log.category."pe.consulta".level=DEBUG

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# El frontend (Vite) consume la API via proxy en dev, pero se habilita CORS
# por si se llama directo (otro origen / despliegue separado).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,content-type

# ---- Area 1 -> Oracle (ver docker-compose.yml: oracle-area1, puerto 1521) ----
# Usuario/clave creados en sql/area1_create_tables.sql (esquema AREA1)
quarkus.datasource.area1.db-kind=oracle
quarkus.datasource.area1.username=${ORA_USER:AREA1}
quarkus.datasource.area1.password=${ORA_PASSWORD:Area1Poc2024}
quarkus.datasource.area1.jdbc.url=${ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
quarkus.datasource.area1.jdbc.max-size=10
quarkus.datasource.area1.jdbc.min-size=1

# ---- Area 2 -> PostgreSQL (ver docker-compose.yml: postgresql-area2, puerto host 5429) ----
quarkus.datasource.area2.db-kind=postgresql
quarkus.datasource.area2.username=${PG_USER:area2_user}
quarkus.datasource.area2.password=${PG_PASSWORD:PgArea2Secure!2024}
quarkus.datasource.area2.jdbc.url=${PG_URL:jdbc:postgresql://localhost:5429/db_area2?currentSchema=area2}
quarkus.datasource.area2.jdbc.max-size=10
quarkus.datasource.area2.jdbc.min-size=1

quarkus.container-image.group=consulta
quarkus.container-image.name=consulta-demo
quarkus.container-image.tag=latest
quarkus.docker.dockerfile-jvm-path=src/main/docker/Dockerfile.jvm